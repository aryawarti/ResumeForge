# Optional local infrastructure. The default backend/.env uses SQLite and no
# object storage, so none of this is needed to run the app.
#
#   postgres  to develop against the database production uses. Postgres is
#             only ever changed by migrations: run `alembic upgrade head`.
#   minio     to exercise PDF download; set FORGE_S3_ENDPOINT_URL to
#             http://localhost:9000.
#
# Production swaps these for Neon and any S3-compatible store (R2, B2, ...).
# The application code is identical; only the URLs change.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: resumeforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d resumeforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
