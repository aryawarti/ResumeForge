# Alembic configuration.
#
# There is no sqlalchemy.url here on purpose. migrations/env.py reads
# FORGE_DATABASE_URL through app.config, so migrations and the running app
# cannot disagree about which database they mean, and a password containing a
# percent sign never meets ConfigParser interpolation.
#
#   alembic upgrade head                         apply every migration
#   alembic revision --autogenerate -m "..."     after changing app/db/models.py

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
